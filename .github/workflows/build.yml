# Builds the APK on Linux with scripts/build.sh.
#   - every push to main (and a run by hand: Actions > Build > Run workflow): the APK as an artifact of the run
#   - every v* tag (git tag v0.2.0 && git push origin v0.2.0): a GitHub release with the APK and its notes
# The recompiler needs default.xbe: ci/default.xbe.enc, decrypted with the XBE_KEY secret. To make it:
#   openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -in assets/default.xbe -out ci/default.xbe.enc -pass file:<key file>
#
# Secrets: XBE_KEY (the passphrase of ci/default.xbe.enc), KEYSTORE_BASE64 (the release .jks in base64),
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Without the keystore the APK has a debug signature.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags and commits, for the list of changes since the previous release

      - name: Free disk space
        run: |
          # the recompiled game and its arm64 objects need well over the runner's free space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-7]* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build clang lld ccache
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;$NDK_VERSION" >/dev/null
          cmake --version | head -1; clang --version | head -1

      - name: Decrypt default.xbe
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::The XBE_KEY secret is missing"; exit 1; fi
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" | tr -d '\r\n' > "$key"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          # build.sh checks the SHA-1 too: anything but the supported image recompiles to a broken game

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No release keystore: the APK has a debug signature"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          # a tag names the version; a push to main is the commit's
          if [ "$RELEASE" = "true" ]; then name="${GITHUB_REF_NAME#v}"; else name="dev-${GITHUB_SHA::7}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 4G
          CCACHE_COMPRESS: "1"
        run: |
          scripts/build.sh --release
          ccache -s | head -5

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk "MostWanted-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: MostWanted-${{ steps.version.outputs.name }}
          path: MostWanted-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Release notes
        if: env.RELEASE == 'true'
        run: |
          apk="MostWanted-${{ steps.version.outputs.name }}.apk"
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{APK}}|$apk|g" \
              -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
              ci/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          # the commits since the previous tag
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty='* %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: NFS Most Wanted (Xbox) for Android ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: MostWanted-${{ steps.version.outputs.name }}.apk
          make_latest: true
